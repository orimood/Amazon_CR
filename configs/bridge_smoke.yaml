# Smoke config for the history-grounded bridge (the redesign).
# Tiny end-to-end validation on Toys_and_Games -> Video_Games, CPU.
name: bridge_smoke
tag: bridge_smoke
device: cpu
seed: 42
d: 32
use_pop: true

# per-vertical recommenders (reused only for frozen item embeddings)
rec_epochs: 2
rec_lr: 0.01
rec_weight_decay: 1.0e-6
rec_batch_size: 1024
rec_steps_per_epoch: 200
subsample_users: 4000

# history-grounded bridge
pool: mean
aug_k: 4
aug_min_frac: 0.4
bridge_hidden: [64]
bridge_bottleneck: null
bridge_lr: 0.001
bridge_weight_decay: 1.0e-5
bridge_dropout: 0.1
bridge_epochs: 20
bridge_batch: 512
bridge_neg: 1
early_stop_patience: 4       # exercise val early-stopping + best-on-val selection
semisup_weight: 0.1          # exercise the CORAL alignment path
semisup_batch: 256
semisup_pool_cap: 5000
map_train_frac: 0.8          # overlap split: bridge-train vs cold-eval

# evaluation
eval_ks: [10, 20]
eval_n_neg: 100
eval_seeds: [0, 1]
max_eval_users: null
holdout: temporal
neg_sampling: popularity      # exercise the popularity-weighted negative sampler
compare_original: true        # exercise the original-mapping head-to-head path
ablation: full
run_baselines: true

pairs:
  - [Toys_and_Games, Video_Games]
