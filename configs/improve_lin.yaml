# Improvement run — Arm 2: regularized LINEAR mapping (A1) + content-collaborative hybrid (C1).
# Same cached recommenders (rec_tag=full). The only change vs Arm 1 is the mapping: a single
# linear layer (map_hidden: []) ~4.2k params instead of the ~33k-param MLP, with stronger weight
# decay — the small-data fix for the thin-overlap sharp-minima collapse (Video Games pairs).
#   PYTHONPATH=src python -m cdr.run_grid --config configs/improve_lin.yaml
name: improve_lin
tag: improve_lin
rec_tag: full
device: cpu
seed: 42
d: 64
use_pop: true

rec_epochs: 15
rec_lr: 0.01
rec_weight_decay: 1.0e-6
rec_batch_size: 4096
rec_steps_per_epoch: null
subsample_users: null

map_hidden: []                  # linear mapping: f(x) = W x + b  (~4.2k params)
map_epochs: 200
map_lr: 0.001
map_weight_decay: 1.0e-4        # stronger reg for the small-overlap regime
map_batch_size: 1024
map_dropout: 0.2
map_cos_weight: 0.5
map_train_frac: 0.8

eval_ks: [10, 20]
eval_n_neg: 100
eval_seeds: [0, 1, 2]
max_eval_users: null

run_baselines: true
run_hybrid: true
hybrid_alphas: [0.0, 0.25, 0.5, 0.75, 1.0]

ablation: full
ablations: [full]

pairs:
  - [Books, Movies_and_TV]
  - [Books, Toys_and_Games]
  - [Movies_and_TV, Toys_and_Games]
  - [Movies_and_TV, CDs_and_Vinyl]
  - [Books, CDs_and_Vinyl]
  - [Movies_and_TV, Video_Games]
  - [Toys_and_Games, Video_Games]
  - [Books, Video_Games]
