# B2 — warm-oracle ceiling diagnostic on the 3-core Video Games target.
# Loads the VG_3core content-grounded recommender (trained by improve_b1_3core) and reports
# content vs warm-oracle vs C2 on the 3 source -> VG_3core pairs. The key question: does the
# denser 3-core target lift the warm-oracle ABOVE content (it was below on Toys->VG at 5-core)?
#   PYTHONPATH=src python -m cdr.run_c2 --config configs/improve_c2_3core.yaml
name: c2_3core
tag: c2_3core
rec_tag: full
rec_tag_overrides: {Video_Games_3core: b1_3core}
device: cpu
seed: 42
d: 64
use_pop: true
text_init: false
freeze_id: false

rec_epochs: 15
rec_lr: 0.01
rec_weight_decay: 1.0e-6
rec_batch_size: 4096
rec_steps_per_epoch: null
subsample_users: null

map_train_frac: 0.8
c2_epochs: 30
c2_lr: 0.01
c2_l2: 1.0e-5

eval_ks: [10, 20]
eval_n_neg: 100
eval_seeds: [0, 1, 2]
max_eval_users: null

run_baselines: true
ablation: full
ablations: [full]

pairs:
  - [Movies_and_TV, Video_Games_3core]
  - [Toys_and_Games, Video_Games_3core]
  - [Books, Video_Games_3core]
